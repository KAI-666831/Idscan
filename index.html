<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="身分證辨識">
<title>身分證辨識（離線）</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1d1f23; --muted:#6b7280; --ok:#16a34a; --bad:#dc2626; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1b1e24; --fg:#e8eaed; --muted:#9aa0a6; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang TC",sans-serif; background:var(--bg); color:var(--fg);
         padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px); }
  h1 { font-size:20px; margin:4px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  button { display:block; width:100%; padding:14px; font-size:17px; border:0; border-radius:12px;
         background:var(--accent); color:#fff; font-weight:600; }
  button.sec { background:transparent; color:var(--accent); border:1px solid var(--accent); margin-top:8px; }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--bad); margin-top:8px; }
  input[type=file] { display:none; }
  canvas#cardView { width:100%; border-radius:10px; margin-top:10px; display:none; }
  .seg { display:flex; gap:6px; margin-bottom:10px; }
  .seg button { flex:1; padding:10px 0; font-size:14px; background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .seg button.on { background:var(--accent); color:#fff; }
  .field { margin:10px 0; }
  .hide { display:none !important; }
  .field label { font-size:13px; color:var(--muted); display:flex; justify-content:space-between; }
  .field input { width:100%; font-size:18px; padding:10px; border-radius:10px; border:1px solid #ccc;
         background:transparent; color:var(--fg); margin-top:4px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #status { font-size:14px; color:var(--muted); margin-top:10px; min-height:20px; }
  progress { width:100%; height:6px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; border-bottom:1px solid rgba(128,128,128,.25); text-align:left; }
  details { font-size:12px; color:var(--muted); margin-top:8px; }
  pre { white-space:pre-wrap; word-break:break-all; }

  /* 客人確認畫面：白底大字 */
  #confirm { position:fixed; inset:0; z-index:20; background:#fff; color:#111; display:none; overflow:auto;
             padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 110px); }
  .cf-title { font-size:24px; font-weight:700; text-align:center; margin-bottom:10px; }
  .cf-title small { font-size:15px; color:#666; font-weight:400; }
  #cfImg { width:100%; border-radius:10px; margin-bottom:8px; }
  .cf-row { border-bottom:1px solid #ddd; padding:10px 2px; }
  .cf-row .k { font-size:14px; color:#666; }
  .cf-row .v { font-size:28px; font-weight:700; letter-spacing:1px; word-break:break-all; }
  .cf-row .v small { font-size:16px; color:#666; font-weight:400; letter-spacing:0; }
  .cf-btns { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; background:#fff;
             padding:12px 18px calc(env(safe-area-inset-bottom) + 12px); box-shadow:0 -2px 8px rgba(0,0,0,.08); }
  .cf-btns button { flex:1; padding:18px 0; font-size:20px; }
  .cf-yes { background:#16a34a; } .cf-no { background:#fff; color:#dc2626; border:2px solid #dc2626; }
  .ck { color:#16a34a; font-weight:700; }

  /* 全螢幕取景 / 裁切畫面 */
  #overlay { position:fixed; inset:0; background:#000; z-index:10; display:none; }
  #overlay video, #overlay img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #overlay img { object-fit:contain; touch-action:none; }
  #frame { position:absolute; border:3px solid #22c55e; border-radius:12px;
           box-shadow:0 0 0 9999px rgba(0,0,0,.55); pointer-events:none; }
  #hint { position:absolute; left:0; right:0; color:#fff; text-align:center; font-size:15px; padding:0 20px; }
  #bar { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 24px);
         display:flex; gap:12px; padding:0 20px; align-items:center; }
  #bar button { flex:1; }
  #shutter { flex:0 0 76px !important; height:76px; border-radius:50%; background:#fff; border:5px solid #888; padding:0; }
  #zoomRow { position:absolute; left:20px; right:20px; bottom:calc(env(safe-area-inset-bottom) + 120px); display:none; }
  #zoomRow input { width:100%; }
</style>
</head>
<body>
<h1>身分證辨識</h1>
<div class="sub">照片只在這支手機上辨識，不會上傳任何伺服器。</div>

<div class="card">
  <div id="types" class="seg">
    <button data-t="id" class="on">身分證</button>
    <button data-t="arc">居留證</button>
    <button data-t="passport">護照</button>
    <button data-t="seaman">船員證</button>
    <button data-t="nhi">健保卡</button>
  </div>
  <button id="scanBtn" onclick="openCamera()">📷 掃描身分證正面</button>
  <button class="sec" onclick="document.getElementById('pick').click()">從相簿選擇</button>
  <input id="pick" type="file" accept="image/*">
  <canvas id="cardView"></canvas>
  <div id="status">準備中…</div>
  <progress id="prog" value="0" max="1" style="display:none"></progress>
</div>

<div class="card">
  <div class="field" data-f="name"><label><span class="lb">姓名</span></label><input id="name" autocomplete="off"></div>
  <div class="field" data-f="nameEn"><label><span class="lb">英文姓名</span></label><input id="nameEn" autocomplete="off" autocapitalize="characters"></div>
  <div class="field" data-f="birth"><label><span class="lb">出生日期</span><span id="birthAd"></span></label><input id="birth" autocomplete="off"></div>
  <div class="field" data-f="idno"><label><span class="lb">身分證字號</span> <span id="idCheck"></span></label>
    <input id="idno" autocomplete="off" autocapitalize="characters" oninput="checkId()"></div>
  <div class="field" data-f="ppno"><label><span class="lb">護照號碼</span> <span id="ppCheck"></span></label><input id="ppno" autocomplete="off" autocapitalize="characters"></div>
  <div class="field" data-f="nat"><label><span class="lb">國籍</span></label><input id="nat" autocomplete="off"></div>
  <div class="field" data-f="docno"><label><span class="lb">手冊號碼</span></label><input id="docno" autocomplete="off" autocapitalize="characters"></div>
  <button onclick="openConfirm()">👤 給客人確認</button>
  <button class="sec" onclick="saveRecord()">直接儲存（不確認）</button>
  <details><summary>辨識原文（除錯用）</summary><pre id="raw"></pre></details>
</div>

<div class="card">
  <b>已儲存 <span id="count">0</span> 筆</b>（只存在這支手機）
  <table id="list"><thead><tr><th>類別</th><th>姓名</th><th>生日</th><th>號碼</th><th>確認</th><th></th></tr></thead><tbody></tbody></table>
  <button class="sec" onclick="exportCsv()">匯出 CSV</button>
  <button class="danger" onclick="clearAll()">全部刪除</button>
</div>

<!-- 給客人看的確認畫面 -->
<div id="confirm">
  <div class="cf-title">請確認您的資料<br><small>Please check your information</small></div>
  <img id="cfImg" alt="">
  <div id="cfRows"></div>
  <div class="cf-btns">
    <button class="cf-no" onclick="confirmNo()">✗ 有錯 Wrong</button>
    <button class="cf-yes" onclick="confirmYes()">✓ 正確 Correct</button>
  </div>
</div>

<div id="overlay">
  <video id="video" playsinline muted autoplay></video>
  <img id="still" alt="">
  <div id="frame"></div>
  <div id="hint"></div>
  <div id="zoomRow"><input id="zoom" type="range" min="0.3" max="4" step="0.01" value="1"></div>
  <div id="bar">
    <button class="sec" style="background:#0008;color:#fff;border-color:#fff" onclick="closeOverlay()">取消</button>
    <button id="shutter" onclick="capture()" aria-label="拍照"></button>
    <button id="useBtn" style="display:none" onclick="useCrop()">使用框內</button>
    <button id="wholeBtn" class="hide" style="display:none" onclick="useWhole()">整張</button>
    <span id="spacer" style="flex:1"></span>
  </div>
</div>

<script src="ort/ort.wasm.min.js"></script>
<script src="docs.js"></script>
<script>
const $ = id => document.getElementById(id);
const CARD = 85.6/54, BOOK = 125/88;
// 每種證件：取景框比例、要顯示的欄位與標題、生日格式（roc=民國 / ad=西元）
const TYPES = {
  id:       { label:'身分證', ratio:CARD, scan:'📷 掃描身分證正面', hint:'把身分證正面對準綠框，填滿框框、避開反光', date:'roc',
              f:{ name:'姓名', birth:'出生年月日（民國）', idno:'身分證字號' } },
  arc:      { label:'居留證', ratio:CARD, scan:'📷 掃描居留證正面', hint:'把居留證正面對準綠框，避開雷射貼紙反光', date:'ad',
              f:{ nameEn:'英文姓名', name:'中文姓名', birth:'出生日期（西元）', idno:'統一證號', ppno:'護照號碼', nat:'國籍' } },
  passport: { label:'護照',   ratio:BOOK, scan:'📷 掃描護照資料頁', hint:'對準有照片的那一頁，最下面兩行英數字要拍進去', date:'ad',
              f:{ nameEn:'英文姓名', name:'中文姓名', birth:'出生日期（西元）', ppno:'護照號碼', nat:'國籍', idno:'身分證字號（台灣護照）' } },
  seaman:   { label:'船員證', ratio:BOOK, scan:'📷 掃描船員服務手冊', hint:'對準有照片、姓名、生日的那一頁', date:'roc',
              f:{ name:'姓名', nameEn:'英文姓名', birth:'出生日期（民國）', idno:'身分證字號', docno:'手冊號碼' } },
  nhi:      { label:'健保卡', ratio:CARD, scan:'📷 掃描健保卡正面', hint:'把健保卡正面對準綠框', date:'roc',
              f:{ name:'姓名', nameEn:'英文姓名', birth:'出生日期（民國）', idno:'身分證／居留證號' } }
};
const ALL_F = ['name','nameEn','birth','idno','ppno','nat','docno'];
let docType = 'id';
function setType(t) {
  docType = t;
  document.querySelectorAll('#types button').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  $('scanBtn').textContent = TYPES[t].scan;
  $('wholeBtn').classList.toggle('hide', t === 'id');
  document.querySelectorAll('[data-f]').forEach(e => {
    const lb = TYPES[t].f[e.dataset.f];
    e.classList.toggle('hide', !lb);
    if (lb) e.querySelector('.lb').textContent = lb;
  });
  $('birth').placeholder = TYPES[t].date === 'roc' ? '例：75/03/21' : '例：1990-03-21';
}
document.querySelectorAll('#types button').forEach(b => b.onclick = () => { setType(b.dataset.t); clearFields(); });
const ratio = () => TYPES[docType].ratio;


// ---------- 身分證字號檢查碼 ----------
const LETTER = {A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,Y:31,Z:33};
// 支援：身分證 A123456789、新式居留證 A800000014（第二碼 8/9）、舊式居留證 AA00000009
function validId(id) {
  let d;
  if (/^[A-Z][1289]\d{8}$/.test(id)) d = id.slice(1).split('').map(Number);
  else if (/^[A-Z][A-D]\d{8}$/.test(id)) d = [LETTER[id[1]] % 10].concat(id.slice(2).split('').map(Number));
  else return false;
  const n = LETTER[id[0]];
  let sum = Math.floor(n/10) + (n%10)*9;
  const w = [8,7,6,5,4,3,2,1];
  for (let i=0;i<8;i++) sum += d[i] * w[i];
  return (sum + d[8]) % 10 === 0;
}

// ---------- 護照 MRZ（ICAO 9303）檢查碼 ----------
function mrzCheck(s) {
  const w = [7,3,1]; let sum = 0;
  for (let i=0;i<s.length;i++) {
    const c = s[i];
    const v = c === '<' ? 0 : /\d/.test(c) ? +c : c.charCodeAt(0) - 55;
    sum += v * w[i%3];
  }
  return sum % 10;
}
const toAlpha = s => s.replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S').replace(/8/g,'B');
const toDigit = s => s.replace(/[OQD]/g,'0').replace(/[IL]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2');
function mrzDate(yymmdd, past) {
  const yy = +yymmdd.slice(0,2), now = new Date().getFullYear() % 100;
  const y = past ? (yy > now ? 1900+yy : 2000+yy) : 2000+yy;
  return `${y}-${yymmdd.slice(2,4)}-${yymmdd.slice(4,6)}`;
}
// 第二行：護照號碼(9)+檢查碼、國籍(3)、生日(6)+檢查碼、性別、效期(6)+檢查碼、個人號碼(14)
function parseMrz2(t) {
  t = t.toUpperCase().replace(/[^A-Z0-9<]/g, '');
  const re = /([A-Z0-9]{5,9})(<{0,4})([0-9OQDILSBZ])([A-Z0<]{3})([0-9OQDILSBZ]{6})([0-9OQDILSBZ])([MFX<])([0-9OQDILSBZ]{6})([0-9OQDILSBZ])([A-Z0-9<]*)/;
  for (let start = 0; start < t.length; start++) {
    const m = t.slice(start).match(re); if (!m) break;
    const doc = (m[1] + m[2]).padEnd(9, '<').slice(0, 9);
    const docCk = +toDigit(m[3]), dob = toDigit(m[5]), dobCk = +toDigit(m[6]);
    if (mrzCheck(doc) === docCk && mrzCheck(dob) === dobCk) {
      const opt = m[10].replace(/<+$/, '').replace(/<.*$/, '');
      return { doc: doc.replace(/<+$/, ''), nat: toAlpha(m[4]).replace(/</g, ''), dob: mrzDate(dob, true), sex: m[7], opt };
    }
    start += m.index;
  }
  return null;
}
// 第一行：P<國籍 姓<<名
function parseMrz1(t) {
  t = t.toUpperCase().replace(/[^A-Z0-9<]/g, '');
  const m = t.match(/P[A-Z<]([A-Z0<]{3})([A-Z0-9<]{2,})/); if (!m) return null;
  const body = toAlpha(m[2]).replace(/<+$/, '');
  const parts = body.split(/<{2,}/);
  const name = parts.length > 1 ? `${parts[0].replace(/</g,' ')}, ${parts[1].replace(/</g,' ')}` : body.replace(/</g,' ');
  return name.trim().length >= 2 ? { name: name.trim().replace(/\s+/g,' ') } : null;
}

// ---------- 取景框：放在畫面中央、身分證比例 ----------
function frameRect() {
  const W = innerWidth, H = innerHeight;
  let w = W * 0.92, h = w / ratio();
  if (h > H * 0.6) { h = H * 0.6; w = h * ratio(); }
  return { x:(W-w)/2, y:(H-h)/2 - 30, w, h };
}
function placeFrame() {
  const r = frameRect(), f = $('frame');
  Object.assign(f.style, { left:r.x+'px', top:r.y+'px', width:r.w+'px', height:r.h+'px' });
  $('hint').style.top = (r.y - 60) + 'px';
}
addEventListener('resize', placeFrame);

let stream = null, mode = null;
async function openCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ideal:3840}, height:{ideal:2160} }, audio:false });
  } catch (e) {
    alert('無法開啟相機，請改用「從相簿選擇」。\n' + e.message); return;
  }
  mode = 'camera';
  $('video').srcObject = stream; $('video').style.display = 'block';
  $('still').style.display = 'none'; $('zoomRow').style.display = 'none';
  $('shutter').style.display = 'block'; $('useBtn').style.display = 'none'; $('wholeBtn').style.display = 'none'; $('spacer').style.display = 'block';
  $('hint').textContent = TYPES[docType].hint;
  $('overlay').style.display = 'block'; placeFrame();
}
function closeOverlay() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('overlay').style.display = 'none';
}

// 把畫面上的框框換算成原始影像座標後裁切（object-fit: cover）
function cropFromVideo() {
  const v = $('video'), vw = v.videoWidth, vh = v.videoHeight;
  const W = innerWidth, H = innerHeight;
  const s = Math.max(W / vw, H / vh);
  const ox = (W - vw*s)/2, oy = (H - vh*s)/2;
  const r = frameRect();
  return drawCrop(v, (r.x-ox)/s, (r.y-oy)/s, r.w/s, r.h/s);
}
function drawCrop(src, sx, sy, sw, sh) {
  const c = document.createElement('canvas');
  c.width = 1600; c.height = Math.round(1600 / ratio());
  c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function capture() {
  if (mode !== 'camera') return;
  const c = cropFromVideo();
  closeOverlay();
  runOcr(c);
}

// ---------- 相簿照片：拖曳 + 縮放對準框框 ----------
let img = null, pan = {x:0, y:0}, baseScale = 1;
$('pick').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  img = new Image();
  img.onload = () => {
    mode = 'photo';
    const r = frameRect();
    baseScale = r.w / img.width * 1.0;             // 預設：整張圖寬度等於框寬
    pan = { x:0, y:0 }; $('zoom').value = 1;
    $('still').src = img.src; $('still').style.display = 'block'; $('video').style.display = 'none';
    $('shutter').style.display = 'none'; $('spacer').style.display = 'none'; $('useBtn').style.display = 'block';
    $('wholeBtn').style.display = docType === 'id' ? 'none' : 'block';
    $('zoomRow').style.display = 'block';
    $('hint').textContent = '拖曳照片、用下方滑桿放大，讓身分證剛好填滿綠框';
    $('overlay').style.display = 'block'; placeFrame(); layoutStill();
  };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
};
function curScale() { return baseScale * Number($('zoom').value); }
function layoutStill() {
  const s = curScale(), st = $('still');
  const w = img.width*s, h = img.height*s;
  Object.assign(st.style, { objectFit:'fill', width:w+'px', height:h+'px', inset:'auto',
    left:(innerWidth-w)/2 + pan.x + 'px', top:(innerHeight-h)/2 - 30 + pan.y + 'px' });
}
$('zoom').oninput = layoutStill;
let drag = null;
$('still').addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, px:pan.x, py:pan.y }; $('still').setPointerCapture(e.pointerId); });
$('still').addEventListener('pointermove', e => { if (!drag) return; pan.x = drag.px + e.clientX - drag.x; pan.y = drag.py + e.clientY - drag.y; layoutStill(); });
$('still').addEventListener('pointerup', () => drag = null);
function useWhole() {
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  closeOverlay(); runOcr(c);
}
function useCrop() {
  const s = curScale(), r = frameRect();
  const left = (innerWidth - img.width*s)/2 + pan.x, top = (innerHeight - img.height*s)/2 - 30 + pan.y;
  const c = drawCrop(img, (r.x-left)/s, (r.y-top)/s, r.w/s, r.h/s);
  closeOverlay();
  runOcr(c);
}

// ---------- OCR：PP-OCRv5 文字辨識模型（完全在手機上跑）----------
// 大檔案（模型、引擎）存在獨立的快取，app 更新時不會被清掉
const MODEL_CACHE = 'idscan-models-v1';
async function getAsset(path, label) {
  const url = new URL(path, location.href).href;
  let cache = null;
  try { cache = await caches.open(MODEL_CACHE); } catch {}
  const hit = cache && await cache.match(url);
  if (hit) return hit.arrayBuffer();
  // 沒有快取才下載，顯示進度
  const res = await fetch(url, { cache:'no-store' });
  if (!res.ok) throw new Error('下載失敗 ' + res.status + ' ' + path);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader(), parts = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    parts.push(value); got += value.length;
    $('status').textContent = `第一次下載${label}… ${(got/1048576).toFixed(1)}${total ? ' / ' + (total/1048576).toFixed(1) : ''} MB（只需一次）`;
    if (total) $('prog').value = got / total;
  }
  const blob = new Blob(parts);
  if (cache) { try { await cache.put(url, new Response(blob, { headers:{ 'content-type':'application/octet-stream' } })); } catch {} }
  return blob.arrayBuffer();
}

let sess = null, dict = null, loading = null;
function loadModel() { return loading || (loading = _loadModel().catch(e => { loading = null; throw e; })); }
async function _loadModel() {
  $('prog').style.display = 'block'; $('prog').removeAttribute('value');
  $('status').textContent = '準備辨識引擎…';
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.wasmPaths = new URL('ort/', location.href).href;
  ort.env.wasm.wasmBinary = await getAsset('ort/ort-wasm-simd-threaded.wasm', '辨識引擎');
  const txt = new TextDecoder().decode(await getAsset('model/ppocrv5_dict.txt', '字典'));
  const buf = await getAsset('model/ppocr_v5_mobile_rec.onnx', '文字模型');
  dict = [''].concat(txt.split('\n').filter((l, i, a) => !(i === a.length - 1 && l === '')), [' ']);
  sess = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'] });
  $('prog').style.display = 'none';
}

// 從裁好的身分證圖切出一條文字列，縮放到高 48，送進模型，CTC 解碼
async function recRegion(card, x0, y0, x1, y1) {
  x0 = Math.max(0,x0); y0 = Math.max(0,y0); x1 = Math.min(1,x1); y1 = Math.min(1,y1);
  const W = card.width, H = card.height, sw = (x1-x0)*W, sh = (y1-y0)*H;
  const h = 48, w = Math.max(16, Math.round(sw * h / sh));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(card, x0*W, y0*H, sw, sh, 0, 0, w, h);
  const px = ctx.getImageData(0, 0, w, h).data;
  const f = new Float32Array(3*h*w), n = h*w;
  for (let i = 0; i < n; i++) {
    f[i]       = px[i*4]   / 127.5 - 1;
    f[n + i]   = px[i*4+1] / 127.5 - 1;
    f[2*n + i] = px[i*4+2] / 127.5 - 1;
  }
  const out = await sess.run({ [sess.inputNames[0]]: new ort.Tensor('float32', f, [1,3,h,w]) });
  const o = out[sess.outputNames[0]], [, T, C] = o.dims, d = o.data;
  let s = '', prev = -1;
  for (let t = 0; t < T; t++) {
    let bi = 0, bv = -Infinity;
    for (let k = 0; k < C; k++) { const v = d[t*C + k]; if (v > bv) { bv = v; bi = k; } }
    if (bi !== prev && bi !== 0) s += dict[bi] || '';
    prev = bi;
  }
  return s.trim().replace(/\s+/g, ' ');
}

const OFFSETS = [[0,0],[0,-0.02],[0,0.02],[-0.02,0],[0.02,0],[0,-0.04],[0,0.04],[-0.02,-0.02],[0.02,0.02]];
const TO_TRAD = { '黄':'黃','颖':'穎','华':'華','国':'國','伟':'偉','杰':'傑','俊':'俊','丽':'麗','婷':'婷','军':'軍','龙':'龍','刘':'劉','陈':'陳','张':'張','吴':'吳','郑':'鄭','许':'許','谢':'謝','罗':'羅','叶':'葉','苏':'蘇','庄':'莊','钟':'鍾','赖':'賴','杨':'楊','萧':'蕭','邓':'鄧','冯':'馮','韩':'韓','贺':'賀','卢':'盧','顾':'顧','汤':'湯' };
const topVote = c => { const e = Object.entries(c).sort((a,b) => b[1]-a[1]); return e.length ? e[0] : null; };
const add = (c, k) => c[k] = (c[k]||0) + 1;

function clearFields() {
  ALL_F.forEach(k => $(k).value = '');
  $('idCheck').textContent = ''; $('birthAd').textContent = ''; $('ppCheck').textContent = '';
}

// 依文字內容判斷是哪種證件（選錯類別時自動切換）
function guessType(lines) {
  const all = lines.map(L => L.t).join(' ');
  if (/居留|Resident|ARC\b/i.test(all)) return 'arc';
  if (/健康保|HEALTH\s*INS/i.test(all)) return 'nhi';
  if (/<<|PASSPORT|護照號|HO\s*CHIEU/i.test(all)) return 'passport';
  if (/BIRTHPLACE|身分證號碼|出生地/i.test(all)) return 'seaman';
  if (/國民身分證/.test(all)) return 'id';
  return null;
}
async function runGeneric(card, log) {
  await loadDet();
  $('status').textContent = '尋找文字…';
  const lines = await readAllLines(card, (i, n) => { $('status').textContent = `辨識文字… ${i}/${n}`; $('prog').value = i/n; });
  lines.forEach(L => log.push(L.t));
  const g = guessType(lines);
  if (g && g !== docType && g !== 'id') setType(g);
  const r = ({ arc:parseArc, passport:parsePassportLines, seaman:parseSeaman, nhi:parseNhi })[docType](lines);
  for (const k of ALL_F) if (r[k]) $(k).value = r[k];
  checkId();
  if (docType === 'passport' && r.mrz) { $('ppCheck').textContent = '✓ MRZ 檢查碼正確'; $('ppCheck').className = 'ok'; }
  $('birthAd').textContent = TYPES[docType].date === 'roc' ? rocToAd($('birth').value) : '';
  const miss = Object.keys(TYPES[docType].f).filter(k => !$(k).value).map(k => TYPES[docType].f[k]);
  $('status').textContent = miss.length ? `完成。沒讀到：${miss.join('、')}，可直接手動填。` : '完成，請核對後儲存。';
}

async function runOcr(card) {
  const view = $('cardView');
  view.width = card.width; view.height = card.height;
  view.getContext('2d').drawImage(card, 0, 0); view.style.display = 'block';
  clearFields();
  const log = [];
  try {
    await loadModel();
    $('prog').style.display = 'block';
    if (docType !== 'id') { await runGeneric(card, log); }
    else {
    const ids = {}, names = {}, births = {};
    for (let k = 0; k < OFFSETS.length; k++) {
      const [dx, dy] = OFFSETS[k];
      $('status').textContent = `辨識中… ${k+1}/${OFFSETS.length}`; $('prog').value = (k+1)/OFFSETS.length;
      if (!(topVote(ids)?.[1] >= 3)) {
        const t = (await recRegion(card, 0.62+dx, 0.82+dy, 1.0, 0.99+dy)).toUpperCase().replace(/\s/g,''); log.push('號: '+t);
        for (const m of t.match(/[A-Z][0-9]{9}/g) || []) if (validId(m)) add(ids, m);
      }
      if (!(topVote(names)?.[1] >= 3)) {
        const t = (await recRegion(card, 0.0+dx, 0.40+dy, 0.70+dx, 0.62+dy)).replace(/\s/g,''); log.push('名: '+t);
        const m = t.match(/名([一-鿿]{2,4})/) || t.match(/([一-鿿]{2,4})$/);
        if (m) add(names, [...m[1]].map(ch => TO_TRAD[ch] || ch).join(''));
      }
      if (!(topVote(births)?.[1] >= 3)) {
        const t = (await recRegion(card, 0.10+dx, 0.62+dy, 0.68+dx, 0.82+dy)).replace(/\s/g,''); log.push('生: '+t);
        const m = t.match(/(\d{2,3})年(\d{1,2})月(\d{1,2})日/);
        if (m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31)
          add(births, `${+m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`);
      }
      if (k >= 2 && topVote(ids)?.[1] >= 3 && topVote(names)?.[1] >= 3 && topVote(births)?.[1] >= 3) break;
    }
    $('idno').value = topVote(ids)?.[0] || ''; checkId();
    $('name').value = topVote(names)?.[0] || '';
    $('birth').value = topVote(births)?.[0] || '';
    $('birthAd').textContent = rocToAd($('birth').value);
    $('status').textContent = '完成，請核對後儲存。空白或有錯的欄位可直接修改。';
    }
  } catch (e) {
    $('status').textContent = '辨識失敗：' + (e && e.message || e);
  }
  $('raw').textContent = log.join('\n');
  $('prog').style.display = 'none';
}

function rocToAd(s) {
  const m = s.match(/^(\d{1,3})\/(\d{1,2})\/(\d{1,2})$/);
  return m ? `西元 ${Number(m[1])+1911}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : '';
}
$('birth').oninput = () => $('birthAd').textContent = TYPES[docType].date === 'roc' ? rocToAd($('birth').value) : '';

function checkId() {
  const v = $('idno').value.trim().toUpperCase();
  const el = $('idCheck');
  if (!v) { el.textContent=''; return; }
  const ok = validId(v);
  el.textContent = ok ? '✓ 檢查碼正確' : '✗ 檢查碼不符'; el.className = ok ? 'ok' : 'bad';
}

// ---------- 本機儲存 ----------
const KEY = 'idscan_records';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const store = a => { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function render() {
  const a = load();
  $('count').textContent = a.length;
  $('list').tBodies[0].innerHTML = a.map((r,i) =>
    `<tr><td>${esc(TYPES[r.type||'id']?.label||'')}</td><td>${esc(r.name||r.nameEn||'')}</td><td>${esc(r.birth)}</td><td>${esc(r.idno||r.ppno||'')}</td><td>${r.confirmed ? '<span class="ck">✓</span>' : ''}</td><td><a href="#" onclick="del(${i});return false">刪</a></td></tr>`).join('');
}
// ---------- 給客人確認 ----------
const EN_LABEL = { name:'Name', nameEn:'Name', birth:'Date of birth', idno:'ID No.', ppno:'Passport No.', nat:'Nationality', docno:'Book No.' };
const groupId = v => /^[A-Z0-9]{10}$/.test(v) ? v.replace(/^(.{4})(.{3})(.{3})$/, '$1 $2 $3') : v;   // 分段比較好核對
function openConfirm() {
  const f = TYPES[docType].f, rows = [];
  for (const k of Object.keys(f)) {
    let v = $(k).value.trim(); if (!v) continue;
    let extra = '';
    if (k === 'birth' && TYPES[docType].date === 'roc') extra = ` <small>(${rocToAd(v).replace('西元 ','')})</small>`;
    if (k === 'idno' || k === 'ppno') v = groupId(v.toUpperCase());
    rows.push(`<div class="cf-row"><div class="k">${esc(f[k].replace(/（.*?）/,''))} ${EN_LABEL[k]}</div><div class="v">${esc(v)}${extra}</div></div>`);
  }
  if (!rows.length) { alert('還沒有資料可以確認'); return; }
  $('cfRows').innerHTML = rows.join('');
  const v = $('cardView');
  if (v.style.display === 'block') { $('cfImg').src = v.toDataURL('image/jpeg', 0.8); $('cfImg').style.display = 'block'; }
  else $('cfImg').style.display = 'none';
  $('confirm').style.display = 'block'; $('confirm').scrollTop = 0;
}
function confirmYes() {
  $('confirm').style.display = 'none'; $('cfImg').src = '';
  saveRecord(true);
  $('status').textContent = '✓ 客人已確認並儲存。可以掃下一位。';
  scrollTo({ top:0, behavior:'smooth' });
}
function confirmNo() {
  $('confirm').style.display = 'none'; $('cfImg').src = '';
  $('status').textContent = '客人說有錯，請修改後再按「給客人確認」。';
  const first = Object.keys(TYPES[docType].f)[0];
  $(first).scrollIntoView({ block:'center' }); $(first).focus();
}

function saveRecord(confirmed) {
  const r = { type:docType, t:new Date().toISOString(), confirmed: confirmed === true };
  for (const k of ALL_F) r[k] = $(k).value.trim();
  r.idno = r.idno.toUpperCase(); r.ppno = r.ppno.toUpperCase();
  r.birthAd = TYPES[docType].date === 'roc' ? (rocToAd(r.birth).replace('西元 ','')) : r.birth;
  if (!r.name && !r.nameEn && !r.idno && !r.ppno) return;
  const a = load(); a.push(r); store(a); render();
  clearFields();
  $('cardView').style.display = 'none';
}
function del(i) { const a = load(); a.splice(i,1); store(a); render(); }
function clearAll() { if (confirm('確定刪除全部資料？')) { store([]); render(); } }
function exportCsv() {
  const rows = [['類別','姓名','英文姓名','出生日期(證件上)','出生日期(西元)','身分證/統一證號','護照號碼','國籍','手冊號碼','客人確認','時間'],
    ...load().map(r => [TYPES[r.type||'id']?.label||'', r.name||'', r.nameEn||'', r.birth||'',
      r.birthAd || (r.type==='id'||!r.type ? rocToAd(r.birth||'').replace('西元 ','') : r.birth||''),
      r.idno||'', r.ppno||'', r.nat||'', r.docno||'', r.confirmed ? '是' : '', r.t])];
  const csv = '﻿' + rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = 'id_records.csv'; a.click();
}
setType('id');
render();
// 開 app 時先在背景載入模型，按掃描時就不用等
setTimeout(() => loadModel().then(() => loadDet()).then(() => { $('status').textContent = '辨識引擎已就緒，可離線使用。'; }).catch(e => { $('status').textContent = '模型載入失敗：' + e.message; }), 300);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
